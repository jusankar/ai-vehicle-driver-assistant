name: ai_vehicle_driver_assistant
description: AI-powered Vehicle & Driver Assistant using Gemini AI & Material 3 UI for small fleet owners.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_generative_ai: ^0.4.0
  provider: ^6.1.2
  speech_to_text: ^7.0.0
  file_picker: ^8.0.3
  intl: ^0.19.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
